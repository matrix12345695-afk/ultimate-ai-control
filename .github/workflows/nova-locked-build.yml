name: NOVA locked build acceptance
on:
  push:
    paths:
      - 'ci/nova-postgres/**'
      - 'ci/nova-browser/**'
      - 'ci/nova-browser-candidate/**'
      - 'ci/nova-locked-build/**'
      - 'ci/nova-release/**'
      - '.github/workflows/nova-locked-build.yml'
  pull_request:
    paths:
      - 'ci/nova-postgres/**'
      - 'ci/nova-browser/**'
      - 'ci/nova-browser-candidate/**'
      - 'ci/nova-locked-build/**'
      - 'ci/nova-release/**'
      - '.github/workflows/nova-locked-build.yml'
permissions:
  contents: read
jobs:
  postgres-tests:
    name: NOVA locked build acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/nova-browser-runtime
    services:
      postgres:
        image: postgres@sha256:f9d1e581cde3e4c8bc696b07e6f7b7aea1d41014b33a52b27990762daae61beb
        env:
          POSTGRES_DB: novaweb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['15432:5432']
        options: >-
          --memory=512m --cpus=1 --pids-limit=64
          --tmpfs /var/lib/postgresql/data:rw,size=192m
          --health-cmd "pg_isready -U postgres -d novaweb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set reviewed Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Set reviewed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed browser dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/nova-browser/requirements.txt
      - name: Install fixed Chromium revision
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run and verify locked build acceptance
        run: python3 ci/nova-locked-build/run.py
      - name: Upload release rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-locked-build-${{ github.run_attempt }}
          path: locked-build-evidence/
          if-no-files-found: error
          retention-days: 30

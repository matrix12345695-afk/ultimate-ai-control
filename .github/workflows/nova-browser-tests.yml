name: NOVA isolated browser tests
on:
  push:
    paths:
      - 'ci/nova-browser/**'
      - '.github/workflows/nova-browser-tests.yml'
  pull_request:
    paths:
      - 'ci/nova-browser/**'
      - '.github/workflows/nova-browser-tests.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    name: NOVA isolated browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/nova-browser-runtime
    steps:
      - name: Checkout exact browser harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set reviewed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed browser dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r ci/nova-browser/requirements.txt
      - name: Install fixed Chromium revision
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Run and verify browser checks
        run: python ci/nova-browser/run.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-browser-evidence-${{ github.run_attempt }}
          path: browser-evidence/
          if-no-files-found: error
          retention-days: 30

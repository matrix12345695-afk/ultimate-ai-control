name: NOVA cross-browser acceptance
on:
  push:
    paths:
      - 'ci/nova-cross-browser/**'
      - 'ci/nova-browser/**'
      - 'ci/nova-browser-candidate/browser_candidate.py'
      - 'ci/nova-postgres/run.py'
      - '.github/workflows/nova-cross-browser.yml'
  pull_request:
    paths:
      - 'ci/nova-cross-browser/**'
      - 'ci/nova-browser/**'
      - 'ci/nova-browser-candidate/browser_candidate.py'
      - 'ci/nova-postgres/run.py'
      - '.github/workflows/nova-cross-browser.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    name: NOVA ${{ matrix.engine }} acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/nova-cross-browser-runtime
    steps:
      - name: Checkout exact harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set reviewed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hashed dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ci/nova-browser/requirements.txt
      - name: Install fixed engine revision
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "$ENGINE" = chromium ]; then
            python -m playwright install --with-deps --only-shell chromium
          else
            python -m playwright install --with-deps "$ENGINE"
          fi
      - name: Run and verify cross-browser checks
        env:
          ENGINE: ${{ matrix.engine }}
        run: python ci/nova-cross-browser/run.py "$ENGINE"
      - name: Upload exact engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-cross-browser-${{ matrix.engine }}-${{ github.run_attempt }}
          path: cross-browser-evidence-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 30
